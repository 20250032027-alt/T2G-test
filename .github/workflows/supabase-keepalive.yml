# Keeps the free Supabase project awake.
# Free projects pause after 7 days without activity. This calls a tiny
# database function once a day so that never happens during quiet weeks.
#
# Setup (once): GitHub repo > Settings > Secrets and variables > Actions >
#   New repository secret  SUPABASE_URL       e.g. https://abcdefghijkl.supabase.co
#   New repository secret  SUPABASE_ANON_KEY  the same publishable/anon key as in site-config.js
# You can run it by hand from the Actions tab ("Run workflow") to test it.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 1 * * *"   # every day at 01:17 UTC (09:17 Philippine time)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the ping function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL / SUPABASE_ANON_KEY are not set yet; skipping."
            exit 0
          fi
          AUTH=()
          case "$SUPABASE_ANON_KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $SUPABASE_ANON_KEY");; esac
          status=$(curl -s -o /tmp/out.txt -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" "${AUTH[@]}" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $status: $(cat /tmp/out.txt)"
          test "$status" = "200"
